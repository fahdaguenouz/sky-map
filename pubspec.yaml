name: sky_map
description: A sky map app to view stars, planets and constellations.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: any
  sensors_plus: any
  geolocator: any
  http: any
  flutter_dotenv: any
  equatable: any
  vector_math: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/constellations.json
